<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover your next favorite story with bookish." />
    <meta name="author" content="Brian Ito" />
    <title>Bookshelf — find your next favorite story</title>
    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Press+Start+2P&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="logo-container">
          <img src="/src/assets/logo.svg" alt="bookish logo" class="logo">
          <div>bookshelf</div>
        </div>
        <nav>
          <a class="active" href="#featured">Discover</a>
          <a href="#categories">Categories</a>
          <a href="#about">About us</a>
        </nav>
        <div class="header-actions">
          <button class="profile-button" aria-label="Your profile">BM</button>
        </div>
      </header>
      <main>
        <section id="hero">
          <div class="side-content">
            <h3>Recommended for you</h3>
            <h2 class="hero-title">Pride and Prejudice</h2>
            <p>by Jane Austen</p>
            <p class="description">A classic novel of manners that explores the themes of love, reputation, and social class in 19th century England.</p>
            <button class="button">Read now</button>
          </div>
          <div class="hero-image">
            <img src="/src/assets/hero.png" alt="Pride and Prejudice book cover">
          </div>
        </section>
      </main>
      <footer>
        <p>Created with ❤️ by Brian Ito. © 2026</p>
      </footer>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
